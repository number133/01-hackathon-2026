<main style="max-width: 560px; margin: 80px auto; padding: 24px; background: #1e293b; border-radius: 12px;">
  <h1 style="margin-top: 0;">Chat scaffold ready</h1>

  <ng-container *ngIf="state() as s">
    <p *ngIf="s.loading">Checking backend health…</p>

    <div *ngIf="s.error" style="color: #fca5a5;">
      <strong>Health check failed:</strong> {{ s.error }}
    </div>

    <dl *ngIf="s.data" style="display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px;">
      <dt>status</dt>
      <dd [style.color]="s.data.status === 'ok' ? '#86efac' : '#fca5a5'">{{ s.data.status }}</dd>

      <dt>db</dt>
      <dd [style.color]="s.data.db === 'ok' ? '#86efac' : '#fca5a5'">{{ s.data.db }}</dd>

      <dt>flywayVersion</dt>
      <dd>{{ s.data.flywayVersion ?? '(none)' }}</dd>

      <ng-container *ngIf="s.data.error">
        <dt>error</dt>
        <dd style="color: #fca5a5;">{{ s.data.error }}</dd>
      </ng-container>
    </dl>
  </ng-container>
</main>
