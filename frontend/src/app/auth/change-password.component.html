<section class="auth-card">
  <h1>Change password</h1>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      <span>Current password</span>
      <input type="password" formControlName="currentPassword" autocomplete="current-password" />
    </label>

    <label>
      <span>New password</span>
      <input type="password" formControlName="newPassword" autocomplete="new-password" />
    </label>

    <label>
      <span>Confirm password</span>
      <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
    </label>

    <p class="muted">Changing your password will sign out every other browser tab and device.</p>

    <div *ngIf="form.errors?.['passwordMismatch'] && form.get('confirmPassword')?.touched" class="error">
      Passwords do not match.
    </div>
    <div *ngIf="error() as msg" class="error">{{ msg }}</div>

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Updating…' : 'Update password' }}
    </button>

    <p class="links"><a routerLink="/account">Cancel</a></p>
  </form>
</section>
