<section class="auth-card">
  <h1>Reset password</h1>

  <form *ngIf="!sent()" [formGroup]="form" (ngSubmit)="submit()">
    <p class="muted">Enter your email and we'll send a reset link.</p>

    <label>
      <span>Email</span>
      <input type="email" formControlName="email" autocomplete="email" />
    </label>

    <div *ngIf="error() as msg" class="error">{{ msg }}</div>

    <button type="submit" [disabled]="submitting() || form.invalid">
      {{ submitting() ? 'Sending…' : 'Send reset link' }}
    </button>

    <p class="links"><a routerLink="/login">Back to sign in</a></p>
  </form>

  <div *ngIf="sent()">
    <p>If an account exists for that email, a reset link has been generated.</p>
    <p class="muted">
      In development, the link is written to the backend log and to
      <code>/api/dev/password-reset-tokens</code>.
    </p>
    <p class="links"><a routerLink="/login">Back to sign in</a></p>
  </div>
</section>
