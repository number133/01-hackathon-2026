<section class="auth-card">
  <h1>Choose a new password</h1>

  <form *ngIf="!done()" [formGroup]="form" (ngSubmit)="submit()">
    <label>
      <span>Reset token</span>
      <input type="text" formControlName="token" />
    </label>

    <label>
      <span>New password</span>
      <input type="password" formControlName="newPassword" autocomplete="new-password" />
    </label>

    <label>
      <span>Confirm password</span>
      <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
    </label>

    <div *ngIf="form.errors?.['passwordMismatch'] && form.get('confirmPassword')?.touched" class="error">
      Passwords do not match.
    </div>
    <div *ngIf="error() as msg" class="error">{{ msg }}</div>

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Updating…' : 'Set new password' }}
    </button>
  </form>

  <div *ngIf="done()">
    <p>Password updated. You can now sign in with the new password.</p>
    <button type="button" (click)="goToLogin()">Sign in</button>
  </div>
</section>
