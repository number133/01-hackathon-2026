<div class="message-scroller" #scroller (scroll)="onScroll()">
  <div *ngIf="loading()" class="muted small center">Loading…</div>

  <app-message-item
    *ngFor="let m of messages(); trackBy: trackByMessage"
    [message]="m"
    [mine]="m.authorId === myUserId"
    [canEdit]="canEdit(m)"
    [canDelete]="canDelete(m)"
    (reply)="onReply($event)">
  </app-message-item>

  <div *ngIf="messages().length === 0 && !loading()" class="empty-state small">
    No messages yet. Say hi!
  </div>
</div>
