<section class="wide-card">
  <h1>Personal chats</h1>
  <div *ngIf="error() as msg" class="error">{{ msg }}</div>

  <div *ngIf="items().length === 0" class="empty-state">
    <p>No personal chats yet.</p>
    Open one from your <a routerLink="/contacts">Contacts</a>.
  </div>
  <ul *ngIf="items().length > 0">
    <li *ngFor="let d of items()">
      <a [routerLink]="['/dialogs', d.id]">
        <app-presence-dot [userId]="d.counterpartId"></app-presence-dot>
        {{ d.counterpartUsername }}
      </a>
      <app-unread-badge [count]="unread.countFor(d.id)"></app-unread-badge>
      <span *ngIf="d.frozen" class="muted">(frozen)</span>
    </li>
  </ul>
</section>
