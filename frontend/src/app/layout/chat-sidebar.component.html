<aside class="chat-sidebar">
  <div class="sidebar-search">
    <input type="text" [formControl]="search" placeholder="Search…" />
  </div>

  <details open class="sidebar-section">
    <summary>Public Rooms</summary>
    <ul class="chat-list">
      <li *ngFor="let r of publicRooms()">
        <a [routerLink]="['/rooms', r.id]" routerLinkActive="active" class="chat-row">
          <app-avatar [name]="r.name"></app-avatar>
          <div class="chat-meta">
            <div class="chat-line">
              <span class="chat-name">{{ r.name }}</span>
            </div>
            <div class="chat-line subtle">
              <span class="chat-preview">{{ r.description || 'public room' }}</span>
              <app-unread-badge [count]="unread.countFor(r.conversationId)"></app-unread-badge>
            </div>
          </div>
        </a>
      </li>
      <li *ngIf="publicRooms().length === 0" class="empty-row">
        <a routerLink="/rooms">Browse catalog</a>
      </li>
    </ul>
  </details>

  <details open class="sidebar-section">
    <summary>Private Rooms</summary>
    <ul class="chat-list">
      <li *ngFor="let r of privateRooms()">
        <a [routerLink]="['/rooms', r.id]" routerLinkActive="active" class="chat-row">
          <app-avatar [name]="r.name"></app-avatar>
          <div class="chat-meta">
            <div class="chat-line">
              <span class="chat-name">🔒 {{ r.name }}</span>
            </div>
            <div class="chat-line subtle">
              <span class="chat-preview">{{ r.description || 'private room' }}</span>
              <app-unread-badge [count]="unread.countFor(r.conversationId)"></app-unread-badge>
            </div>
          </div>
        </a>
      </li>
      <li *ngIf="privateRooms().length === 0" class="empty-row">No private rooms.</li>
    </ul>
  </details>

  <details open class="sidebar-section">
    <summary>Contacts</summary>
    <ul class="chat-list">
      <li *ngFor="let f of contacts()">
        <a *ngIf="dialogIdFor(f.userId) as dlgId; else openCta"
           [routerLink]="['/dialogs', dlgId]" routerLinkActive="active" class="chat-row">
          <div class="avatar-wrap">
            <app-avatar [name]="f.username"></app-avatar>
            <app-presence-dot class="dot-overlay" [userId]="f.userId"></app-presence-dot>
          </div>
          <div class="chat-meta">
            <div class="chat-line">
              <span class="chat-name">{{ f.username }}</span>
            </div>
            <div class="chat-line subtle">
              <span class="chat-preview">direct chat</span>
              <app-unread-badge [count]="unread.countFor(dlgId)"></app-unread-badge>
            </div>
          </div>
        </a>
        <ng-template #openCta>
          <button type="button" class="chat-row as-button" (click)="openContact(f.userId)">
            <div class="avatar-wrap">
              <app-avatar [name]="f.username"></app-avatar>
              <app-presence-dot class="dot-overlay" [userId]="f.userId"></app-presence-dot>
            </div>
            <div class="chat-meta">
              <div class="chat-line">
                <span class="chat-name">{{ f.username }}</span>
              </div>
              <div class="chat-line subtle">
                <span class="chat-preview">start a chat</span>
              </div>
            </div>
          </button>
        </ng-template>
      </li>
      <li *ngIf="contacts().length === 0" class="empty-row">
        <a routerLink="/contacts">Add a contact</a>
      </li>
    </ul>
  </details>

  <div class="sidebar-actions">
    <a routerLink="/rooms/new"><button type="button">Create room</button></a>
  </div>
</aside>
