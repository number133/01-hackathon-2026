<header class="top-menu">
  <a routerLink="/" class="brand">Chat</a>

  <nav>
    <ng-container *ngIf="user() as u; else anonymous">
      <a routerLink="/rooms" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        Public Rooms
        <span *ngIf="totalUnread() > 0" class="badge">{{ totalUnread() > 99 ? '99+' : totalUnread() }}</span>
      </a>
      <a routerLink="/rooms/private" routerLinkActive="active">Private Rooms</a>
      <a routerLink="/contacts" routerLinkActive="active">Contacts</a>
      <a routerLink="/sessions" routerLinkActive="active">Sessions</a>

      <span class="spacer"></span>

      <div class="profile-menu" [class.open]="profileOpen()">
        <button type="button" class="link profile-toggle" (click)="toggleProfile()">
          {{ u.username }}
          <span *ngIf="profileNotifications() > 0" class="badge">{{ profileNotifications() }}</span>
          <span class="caret">▾</span>
        </button>
        <div class="profile-dropdown" *ngIf="profileOpen()">
          <a routerLink="/account" (click)="closeProfile()">Account</a>
          <a routerLink="/dialogs" (click)="closeProfile()">
            Personal chats
          </a>
          <a routerLink="/invitations" (click)="closeProfile()">
            Invitations
            <span *ngIf="pendingInvites() > 0" class="badge">{{ pendingInvites() }}</span>
          </a>
          <a routerLink="/friend-requests" (click)="closeProfile()">
            Friend requests
            <span *ngIf="pendingFriendRequests() > 0" class="badge">{{ pendingFriendRequests() }}</span>
          </a>
          <button type="button" class="link danger signout" (click)="logout()">Sign out</button>
        </div>
      </div>
    </ng-container>
    <ng-template #anonymous>
      <span class="spacer"></span>
      <a routerLink="/login">Sign in</a>
      <a routerLink="/register">Register</a>
    </ng-template>
  </nav>
</header>
