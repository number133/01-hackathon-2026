<section class="auth-card">
  <h1>Create room</h1>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      <span>Name</span>
      <input type="text" formControlName="name" maxlength="80" />
    </label>

    <label>
      <span>Description</span>
      <textarea formControlName="description" maxlength="2000" rows="3"></textarea>
    </label>

    <label>
      <span>Visibility</span>
      <div class="row">
        <label class="inline">
          <input type="radio" formControlName="visibility" value="public" />
          <span>Public</span>
        </label>
        <label class="inline">
          <input type="radio" formControlName="visibility" value="private" />
          <span>Private</span>
        </label>
      </div>
    </label>

    <div *ngIf="error() as msg" class="error">{{ msg }}</div>

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Creating…' : 'Create' }}
    </button>

    <p class="links"><a routerLink="/rooms">Cancel</a></p>
  </form>
</section>
