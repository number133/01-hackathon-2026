<div class="chat-shell" *ngIf="!loading(); else loadingTpl">
  <app-chat-sidebar></app-chat-sidebar>

  <section class="chat-main">
    <div *ngIf="error() as msg" class="error">{{ msg }}</div>

    <ng-container *ngIf="room() as r">
      <header class="chat-header">
        <div>
          <h1># {{ r.name }}
            <span class="badge">{{ r.visibility }}</span>
          </h1>
          <p class="muted">{{ r.description || 'No description.' }}</p>
        </div>
        <div class="row gap">
          <button *ngIf="!r.myRole && r.visibility === 'public'" type="button" (click)="join()">Join</button>
          <button *ngIf="r.myRole && r.myRole !== 'owner'" type="button" (click)="leave()">Leave</button>
        </div>
      </header>

      <ng-container *ngIf="r.myRole; else notMember">
        <app-message-list
          #list
          [roomId]="r.id"
          [conversationId]="r.conversationId"
          [myUserId]="myUserId()"
          [myRole]="r.myRole">
        </app-message-list>

        <app-composer
          [roomId]="r.id"
          [conversationId]="r.conversationId"
          [replyingTo]="list.replyingTo()"
          (clearReply)="list.clearReply()">
        </app-composer>
      </ng-container>

      <ng-template #notMember>
        <div class="empty-state">
          Join the room to see members and messages.
        </div>
      </ng-template>
    </ng-container>
  </section>

  <app-room-context-pane
    *ngIf="room() as r"
    [room]="r"
    [members]="members()"
    (manageRequested)="manageOpen.set(true)">
  </app-room-context-pane>
</div>

<ng-template #loadingTpl>
  <p class="booting">Loading room…</p>
</ng-template>

<app-manage-room
  *ngIf="manageOpen() && room()?.myRole"
  [roomId]="room()!.id"
  [myRole]="room()!.myRole ?? null"
  (closed)="manageOpen.set(false)">
</app-manage-room>
